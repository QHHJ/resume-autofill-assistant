name: Build, lint and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec turbo lint
      - run: pnpm type-check
      - run: pnpm -F chrome-extension test
      - uses: actions/upload-artifact@v4
        with:
          name: resume-autofill-assistant-unpacked
          path: dist/
          if-no-files-found: error
